<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · Gym Partner</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1f1c; --muted: #5b6660; --accent: #138a43; --field: #f2f5f3; --danger: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0f0d; --fg: #f2f5f3; --muted: #9aa59d; --accent: #39f27b; --field: #171d1a; --danger: #ef4444; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px 64px; }
  nav { font-size: 14px; margin-bottom: 24px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input { box-sizing: border-box; width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 12px; border: 1px solid var(--muted); background: var(--field); color: var(--fg); }
  button { margin-top: 20px; width: 100%; padding: 14px; font-size: 16px; font-weight: 700; border: 0; border-radius: 999px; background: var(--accent); color: #000; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { margin-top: 16px; }
  .error { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <nav><a href="index.html">Gym Partner</a> · <a href="privacy-policy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="delete-account.html">Delete account</a></nav>
  <h1>Reset your password</h1>
  <p class="meta" id="status">Checking your reset link…</p>

  <form id="form" hidden>
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="6" required>
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
    <button id="submit" type="submit">Save new password</button>
  </form>
  <p class="msg" id="msg"></p>

  <p class="meta">Contact: <a href="mailto:gympartner.support@gmail.com">gympartner.support@gmail.com</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
  // Public project URL and publishable key (the same values ship inside the app)
  var SUPABASE_URL = 'https://duciboszjxlicryalimk.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_olyJkT6xc1piTj3p5XBVLA_mz-rkYk4';

  var statusEl = document.getElementById('status');
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var submit = document.getElementById('submit');

  function fail(text) {
    statusEl.textContent = text;
    statusEl.className = 'meta error';
    form.hidden = true;
  }

  // An expired or already-used link arrives with the error in the URL fragment
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  var query = new URLSearchParams(location.search);
  var linkError = hash.get('error_description') || query.get('error_description');

  if (linkError) {
    fail('This reset link is invalid or has expired. Open Gym Partner, tap "Forgot password" and use the newest email.');
  } else {
    // detectSessionInUrl reads the recovery token from the link
    var client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { detectSessionInUrl: true, persistSession: false, autoRefreshToken: false }
    });
    var ready = false;
    var showForm = function () {
      if (ready) return;
      ready = true;
      statusEl.textContent = 'Choose a new password for your Gym Partner account.';
      form.hidden = false;
      // Remove the token from the address bar
      history.replaceState(null, '', location.pathname);
    };
    client.auth.onAuthStateChange(function (event, session) {
      if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) showForm();
    });
    client.auth.getSession().then(function (res) {
      if (res.data && res.data.session) showForm();
      else setTimeout(function () {
        if (!ready) fail('This page only works from the reset link in your email. Open Gym Partner, tap "Forgot password" and use the newest email.');
      }, 1500);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';
      var pw = document.getElementById('pw').value;
      if (pw.length < 6) { msg.textContent = 'Use at least 6 characters.'; msg.className = 'msg error'; return; }
      if (pw !== document.getElementById('pw2').value) { msg.textContent = 'The passwords do not match.'; msg.className = 'msg error'; return; }
      submit.disabled = true;
      client.auth.updateUser({ password: pw }).then(function (res) {
        if (res.error) {
          msg.textContent = res.error.message;
          msg.className = 'msg error';
          submit.disabled = false;
          return;
        }
        form.hidden = true;
        statusEl.textContent = 'Password updated. Open Gym Partner and sign in with your new password.';
        statusEl.className = 'meta';
        client.auth.signOut();
      });
    });
  }
</script>
</body>
</html>
